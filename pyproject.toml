[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noteslib"
authors = [{name="Robert Follek", email="bfollek@gmail.com"}]
maintainers = [{name="Marcelo Huerta", email="richieadler@gmail.com"}]
readme = "README.md"
dynamic = ["version", "description"]
requires-python = ">=3.9"
license = "MIT"
dependencies = [
	"pywin32",
	"whenever>=0.6.16,<1.0",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Win32 (MS Windows)",
	"Intended Audience :: Developers",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Database",
	"Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.version]
path = "src/noteslib/__init__.py"

[tool.hatch.envs.test]
platforms = ["windows"]
description = "Testing with pytest, including coverage"
python = "3.9-32"
dependencies = [
	"lxml",
	"pytest",
	"pytest-cov",
	"pytest-check",
	"wmi",
]

[tool.hatch.envs.test.scripts]
test = "pytest --cov=src/noteslib --cov-report=term-missing tests"
test-v = "pytest -vv --cov=src/noteslib --cov-report=term-missing tests"

[tool.hatch.envs.lint]
platforms = ["windows"]
description = "Syntax and format checking"
python = "3.9-32"
dependencies = [
	"ruff>=0.8.4",
	"mypy",
]

[tool.hatch.envs.lint.scripts]
check = [
	"- ruff check --diff src",
	"- ruff format --diff src",
	"- mypy src"
]
check-tests = [
	"- ruff check tests",
	"- ruff format --diff tests",
]
check-types = [
	"mypy --disallow-untyped-calls --disallow-untyped-defs --disallow-incomplete-defs src"
]
fmt = [
	"ruff format src",
]
fmt-tests = [
	"ruff format tests",
]

[tool.pylint]
good-names = "s,nc,ns,db,ix"
max-line-length = 140

[[tool.mypy.overrides]]

module = [
	"win32com.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length=140
indent-width=4
target-version="py39"

[tool.ruff.lint]
select = [
	"RUF",          # Ruff own rules
	"E", "W",       # pycodestyle
	"I",            # isort
	"PL",           # pylint
	"B",            # flake8-bugbear
	"A",            # flake8-builtins
	"DTZ",          # flake8-datetimez
	"UP",           # pyupgrade
	"ERA",          # eradicate
]
