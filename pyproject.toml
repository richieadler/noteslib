[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noteslib"
authors = [{name="Robert Follek", email="bfollek@gmail.com"}]
maintainers = [{name="Marcelo Huerta", email="richieadler@gmail.com"}]
readme = "README.md"
dynamic = ["version", "description"]
requires-python = ">=3.9"
license = "MIT"
dependencies = [
	"pywin32",
	"whenever>=0.6.16,<1.0",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Win32 (MS Windows)",
	"Intended Audience :: Developers",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Database",
	"Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.version]
path = "src/noteslib/__init__.py"

[tool.hatch.envs.hatch-test]
platforms = ["windows"]
description = "Testing with pytest, including coverage"
extra-dependencies = [
	"lxml",
	"pytest-cov",
	"pytest-check",
	"wmi",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11-32", "3.10-32", "3.9-32"]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "pytest{env:HATCH_TEST_ARGS:} {args} --cov=src/noteslib --cov-report=term-missing tests"
cov-combine = "coverage combine"
cov-report = "coverage report"

[tool.hatch.envs.lint]
platforms = ["windows"]
description = "Syntax and format checking"
dependencies = [
	"ruff>=0.8.4",
	"mypy",
]

[tool.hatch.envs.lint.scripts]
check = [
	"ruff check src",
	"mypy src",
	"- ruff format --diff src",
]
check-tests = [
	"ruff check tests --extend-select PT",
	"- ruff format --diff tests",
]
check-types = [
	"mypy --disallow-untyped-calls --disallow-untyped-defs --disallow-incomplete-defs src"
]
fmt = [
	"ruff format src",
]
fmt-tests = [
	"ruff format tests",
]

[[tool.mypy.overrides]]
module = [
	"win32com.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length=140
indent-width=4
target-version="py39"

[tool.ruff.lint]
select = [
	"RUF",          # Ruff own rules
	"E", "W",       # pycodestyle
    "N",            # pep8-naming
	"I",            # isort
	"PL",           # pylint
	"B",            # flake8-bugbear
	"A",            # flake8-builtins
	"DTZ",          # flake8-datetimez
	"UP",           # pyupgrade
	"ERA",          # eradicate
]

[tool.ruff.format]
quote-style = "preserve"
